<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bločky – dnes</title>
<style>
  :root { --bg:#f6f4f1; --card:#fff; --fg:#1f1a17; --muted:#6d625b; --line:#e2dbd4; --red:#b8261f; --ok:#2f7a3d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  h1 { font-size:22px; margin:4px 0 0; }
  .sum { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; }
  .sum b { font-size:22px; display:block; }
  .sum span { color:var(--muted); font-size:14px; }
  .row { display:flex; gap:8px; align-items:center; }
  .row input { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:10px; }
  .row label { color:var(--muted); font-size:14px; }
  .stav { color:var(--muted); font-size:13px; }
  .stav.err { color:var(--red); }
  .bl { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .bl.test { border:2px dashed var(--muted); opacity:.75; }
  .bl.call { border:2px solid var(--red); }
  .bl pre { margin:0; font:13px/1.35 ui-monospace, Menlo, monospace; white-space:pre-wrap; word-break:break-word; }
  .bl .big { font-weight:800; font-size:15px; }
  .bl .red { color:var(--red); font-weight:900; font-size:17px; }
  .bl.opr { border:3px solid var(--red); }
  .empty { color:var(--muted); text-align:center; padding:30px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Bločky</h1>
  <div class="row"><label for="den">Deň:</label><input type="date" id="den"></div>
  <div class="sum" id="sum"></div>
  <div class="stav" id="stav">Načítavam…</div>
  <div id="zoznam"></div>
</div>
<script>
const API = "https://ianslaoxiuwoztwqqkyk.supabase.co/functions/v1/objednavky";
const kluc = new URLSearchParams(location.search).get("k") || "";
const $ = (id) => document.getElementById(id);
const dnes = () => new Date().toLocaleDateString("sv-SE", { timeZone: "Europe/Bratislava" });
$("den").value = dnes();
const eur = (x) => Number(x || 0).toFixed(2).replace(".", ",") + " €";
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const CERVENE = /^(!!!!|OPRAVA BLOCKU|PLATI TENTO|STARY ZAHODIT|ZRUSENA|OBJEDNAVKA c\.\d|NEPRIPRAVOVAT|NEVOZIT|ZRUSENE:|ZAVOLAT$|ZAKAZNIKOVI$|NEDOKONCENA$|OBJEDNAVKA$|ZMENA$|K OBJEDNAVKE c\.\d|OBJEDNAVKY$)/;
const VELKE = /^(TEL:|ADRESA:|SPOLU:|DORUCIT DO:|PRIPRAVIT DO:|\*\*\* TEST|NEPRIPRAVOVAT|!! ZAVOLAT|overit )/;

async function nacitaj() {
  if (!kluc) { $("stav").textContent = "V odkaze chýba kľúč."; $("stav").className = "stav err"; return; }
  try {
    const r = await fetch(API + "?k=" + encodeURIComponent(kluc), { cache: "no-store" });
    const d = await r.json();
    if (!d.ok) throw new Error(d.chyba || r.status);
    const den = $("den").value;
    const obj = d.objednavky.filter((o) => new Date(o.prijata).toLocaleDateString("sv-SE", { timeZone: "Europe/Bratislava" }) === den);
    const ostre = obj.filter((o) => !o.test && !o.zrusena && !o.nedokoncena && o.zmena_k == null);
    const trzba = ostre.reduce((s, o) => s + Number(o.suma || 0), 0);
    const rozvoz = ostre.filter((o) => /rozvoz/i.test(o.sposob || "")).length;
    $("sum").innerHTML =
      `<div><b>${ostre.length}</b><span>objednávok</span></div>` +
      `<div><b>${eur(trzba)}</b><span>tržba</span></div>` +
      `<div><b>${rozvoz}</b><span>rozvoz</span></div>` +
      `<div><b>${ostre.length - rozvoz}</b><span>osobný odber</span></div>`;
    $("zoznam").innerHTML = obj.length ? obj.map((o) => {
      const riadky = esc(o.blocek).split("\n").map((l) => CERVENE.test(l) ? `<span class="red">${l}</span>` : VELKE.test(l) ? `<span class="big">${l}</span>` : l).join("\n");
      const call = /!! ZAVOLAT/.test(o.blocek);
      return `<div class="bl${o.test ? " test" : ""}${call ? " call" : ""}${/OPRAVA BLOCKU/.test(o.blocek) || o.zrusena || o.zmena_k != null ? " opr" : ""}" style="margin-bottom:10px"><pre>${riadky.trim()}</pre></div>`;
    }).join("") : `<div class="empty">V tento deň žiadne objednávky.</div>`;
    $("stav").textContent = "Aktualizované " + new Date().toLocaleTimeString("sk-SK") + " · obnovuje sa každých 30 s";
    $("stav").className = "stav";
  } catch (e) { $("stav").textContent = "Chyba načítania (" + e.message + ")."; $("stav").className = "stav err"; }
}
$("den").onchange = nacitaj;
nacitaj();
setInterval(() => { if ($("den").value === dnes()) nacitaj(); }, 30000);
</script>
</body>
</html>
